<nav class="top-header">
  <div class="header-wrap">
    <div class="brand" routerLink="/home">
      <span class="brand-icon">🎓</span>
      <span class="brand-text">LearnSphere</span>
    </div>

    <div class="center-links">
      <button class="nav-link-btn" type="button" routerLink="/diplomas">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-5l-3 3-3-3H6a2 2 0 0 1-2-2V6z" />
        </svg>
        Diplomas
      </button>
      <button class="nav-link-btn" type="button" routerLink="/certificates">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 3h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-4l-2 4-2-4H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
          <circle cx="12" cy="10" r="2.5" />
        </svg>
        Certificates
      </button>
    </div>

    <div class="right-actions">
      <button class="apply-btn" type="button" routerLink="/dashboard" *ngIf="isAdmin">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4h7v7H4z" />
          <path d="M13 4h7v4h-7z" />
          <path d="M13 10h7v10h-7z" />
          <path d="M4 13h7v7H4z" />
        </svg>
        Dashboard
      </button>

      <button class="nav-link-btn home-btn" type="button" routerLink="/home" aria-label="Home">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z" />
        </svg>
      </button>

      <button class="nav-link-btn profile-btn" type="button" routerLink="/profile" *ngIf="isUser" aria-label="Profile">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z" />
          <path d="M4 20a8 8 0 0 1 16 0" />
        </svg>
      </button>

      <button class="nav-link-btn profile-btn" type="button" routerLink="/admin/profile" *ngIf="isAdmin" aria-label="Profile">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z" />
          <path d="M4 20a8 8 0 0 1 16 0" />
        </svg>
      </button>

      <button class="nav-link-btn contact-btn" type="button" routerLink="/contact" aria-label="Contact Us">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6z" />
          <path d="M4.5 7.5 12 12l7.5-4.5" />
        </svg>
      </button>

      <div class="notif-wrap" *ngIf="loggedIn">
        <button class="notif-btn" type="button" (click)="toggleNotifications()">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a5 5 0 0 0-5 5v3l-2 3h14l-2-3V8a5 5 0 0 0-5-5z" />
            <path d="M9.5 18a2.5 2.5 0 0 0 5 0" />
          </svg>
          <span class="notif-badge" *ngIf="unreadCount">{{ unreadCount }}</span>
        </button>
        <div class="notif-menu" *ngIf="showNotifications">
          <div class="notif-empty" *ngIf="!notifications.length">No notifications</div>
          <button
            class="notif-item"
            type="button"
            *ngFor="let item of notifications"
            [class.unread]="!item.isRead"
            (click)="markRead(item)"
          >
            <div class="notif-title">{{ item.title }}</div>
            <div class="notif-message">{{ item.message }}</div>
          </button>
        </div>
      </div>

      <div class="lang-switch">
        <button class="lang-trigger" type="button" (click)="toggleLanguage()" aria-label="Language">
          <svg class="flag" *ngIf="selectedLanguage === 'EN'" viewBox="0 0 24 24" aria-hidden="true">
            <rect width="24" height="24" fill="#b91c1c" />
            <rect y="4" width="24" height="2" fill="#ffffff" />
            <rect y="8" width="24" height="2" fill="#ffffff" />
            <rect y="12" width="24" height="2" fill="#ffffff" />
            <rect y="16" width="24" height="2" fill="#ffffff" />
            <rect y="20" width="24" height="2" fill="#ffffff" />
            <rect width="11" height="12" fill="#1e3a8a" />
            <circle cx="3" cy="3" r="0.8" fill="#ffffff" />
            <circle cx="6" cy="3" r="0.8" fill="#ffffff" />
            <circle cx="9" cy="3" r="0.8" fill="#ffffff" />
            <circle cx="3" cy="6" r="0.8" fill="#ffffff" />
            <circle cx="6" cy="6" r="0.8" fill="#ffffff" />
            <circle cx="9" cy="6" r="0.8" fill="#ffffff" />
            <circle cx="3" cy="9" r="0.8" fill="#ffffff" />
            <circle cx="6" cy="9" r="0.8" fill="#ffffff" />
            <circle cx="9" cy="9" r="0.8" fill="#ffffff" />
          </svg>
          <svg class="flag" *ngIf="selectedLanguage === 'FR'" viewBox="0 0 24 24" aria-hidden="true">
            <rect width="8" height="24" fill="#1d4ed8" />
            <rect x="8" width="8" height="24" fill="#ffffff" />
            <rect x="16" width="8" height="24" fill="#dc2626" />
          </svg>
          <svg class="flag" *ngIf="selectedLanguage === 'AR'" viewBox="0 0 24 24" aria-hidden="true">
            <rect width="24" height="24" fill="#0f9d58" />
            <rect x="3" y="11" width="18" height="2" fill="#ffffff" opacity="0.9" />
            <path d="M7 9h10" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
            <path d="M8 15h8" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
          </svg>
        </button>
        <div class="lang-menu" *ngIf="showLanguage">
          <button class="lang-item" type="button" (click)="selectLanguage('EN')">
            <svg class="flag" viewBox="0 0 24 24" aria-hidden="true">
              <rect width="24" height="24" fill="#b91c1c" />
              <rect y="4" width="24" height="2" fill="#ffffff" />
              <rect y="8" width="24" height="2" fill="#ffffff" />
              <rect y="12" width="24" height="2" fill="#ffffff" />
              <rect y="16" width="24" height="2" fill="#ffffff" />
              <rect y="20" width="24" height="2" fill="#ffffff" />
              <rect width="11" height="12" fill="#1e3a8a" />
              <circle cx="3" cy="3" r="0.8" fill="#ffffff" />
              <circle cx="6" cy="3" r="0.8" fill="#ffffff" />
              <circle cx="9" cy="3" r="0.8" fill="#ffffff" />
              <circle cx="3" cy="6" r="0.8" fill="#ffffff" />
              <circle cx="6" cy="6" r="0.8" fill="#ffffff" />
              <circle cx="9" cy="6" r="0.8" fill="#ffffff" />
              <circle cx="3" cy="9" r="0.8" fill="#ffffff" />
              <circle cx="6" cy="9" r="0.8" fill="#ffffff" />
              <circle cx="9" cy="9" r="0.8" fill="#ffffff" />
            </svg>
            English
          </button>
          <button class="lang-item" type="button" (click)="selectLanguage('FR')">
            <svg class="flag" viewBox="0 0 24 24" aria-hidden="true">
              <rect width="8" height="24" fill="#1d4ed8" />
              <rect x="8" width="8" height="24" fill="#ffffff" />
              <rect x="16" width="8" height="24" fill="#dc2626" />
            </svg>
            Francais
          </button>
          <button class="lang-item" type="button" (click)="selectLanguage('AR')">
            <svg class="flag" viewBox="0 0 24 24" aria-hidden="true">
              <rect width="24" height="24" fill="#0f9d58" />
              <rect x="3" y="11" width="18" height="2" fill="#ffffff" opacity="0.9" />
              <path d="M7 9h10" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
              <path d="M8 15h8" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
            </svg>
            العربية
          </button>
        </div>
      </div>

      <button class="nav-link-btn login-btn" type="button" routerLink="/login" *ngIf="!loggedIn" aria-label="Login">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="8" r="3.5" />
          <path d="M3.5 20a5.5 5.5 0 0 1 11 0" />
          <path d="M16 12h5m0 0-2-2m2 2-2 2" />
        </svg>
      </button>
      <button class="nav-link-btn logout-btn" type="button" (click)="logout()" *ngIf="loggedIn" aria-label="Logout">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6" />
          <path d="M14 12H4m0 0 3-3m-3 3 3 3" />
        </svg>
      </button>
    </div>
  </div>
</nav>
