<nav class="top-header">
  <div class="header-wrap">
    <div class="brand" routerLink="/home">
      <span class="brand-icon">🎓</span>
      <span class="brand-text">LearnSphere</span>
    </div>

    <div class="center-links">
      <button class="nav-link-btn" type="button" routerLink="/home">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z" />
        </svg>
        Home
      </button>
      <button class="nav-link-btn" type="button" routerLink="/diplomas">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-5l-3 3-3-3H6a2 2 0 0 1-2-2V6z" />
        </svg>
        Diplomas
      </button>
      <button class="nav-link-btn" type="button" routerLink="/certificates">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 3h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-4l-2 4-2-4H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
          <circle cx="12" cy="10" r="2.5" />
        </svg>
        Certificates
      </button>
      <button class="nav-link-btn" type="button" routerLink="/contact">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6z" />
          <path d="M4.5 7.5 12 12l7.5-4.5" />
        </svg>
        Contact Us
      </button>
    </div>

    <div class="right-actions">
      <button class="apply-btn" type="button" routerLink="/dashboard" *ngIf="isAdmin">
        Dashboard
      </button>

      <button class="nav-link-btn small-link" type="button" routerLink="/profile" *ngIf="isUser">
        Profile
      </button>

      <button class="nav-link-btn small-link" type="button" routerLink="/admin/profile" *ngIf="isAdmin">
        Profile
      </button>

      <div class="notif-wrap" *ngIf="loggedIn">
        <button class="notif-btn" type="button" (click)="toggleNotifications()">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a5 5 0 0 0-5 5v3l-2 3h14l-2-3V8a5 5 0 0 0-5-5z" />
            <path d="M9.5 18a2.5 2.5 0 0 0 5 0" />
          </svg>
          <span class="notif-badge" *ngIf="unreadCount">{{ unreadCount }}</span>
        </button>
        <div class="notif-menu" *ngIf="showNotifications">
          <div class="notif-empty" *ngIf="!notifications.length">No notifications</div>
          <button
            class="notif-item"
            type="button"
            *ngFor="let item of notifications"
            [class.unread]="!item.isRead"
            (click)="markRead(item)"
          >
            <div class="notif-title">{{ item.title }}</div>
            <div class="notif-message">{{ item.message }}</div>
          </button>
        </div>
      </div>

      <button class="nav-link-btn login-btn" type="button" routerLink="/login" *ngIf="!loggedIn">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM4 20a6 6 0 0 1 12 0H4z" />
          <path d="M14 12h6m0 0-2-2m2 2-2 2" />
        </svg>
        Login
      </button>
      <button class="nav-link-btn login-btn" type="button" (click)="logout()" *ngIf="loggedIn">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM4 20a6 6 0 0 1 12 0H4z" />
          <path d="M20 12h-6m0 0 2-2m-2 2 2 2" />
        </svg>
        Logout
      </button>
    </div>
  </div>
</nav>
