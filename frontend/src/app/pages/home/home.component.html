<div class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h2 class="mb-1">Diplomas</h2>
      <p class="text-muted mb-0">Browse available diplomas and programs.</p>
    </div>
  </div>

  <div class="diploma-grid">
    <div class="diploma-card" *ngFor="let diploma of diplomas">
      <div class="badge">Diploma</div>
      <h3 class="title">{{ diploma.title }}</h3>
      <p class="label">{{ diploma.label }}</p>
      <button class="btn btn-dark btn-sm">View Details</button>
    </div>
  </div>
</div>
