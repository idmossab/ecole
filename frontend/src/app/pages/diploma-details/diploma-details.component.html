<div class="container py-4">
  <div class="diploma-header">
    <div>
      <span class="pill">Diploma</span>
      <h1 class="display-font">{{ diploma.title }}</h1>
      <p class="lead">{{ diploma.description }}</p>
      <div class="requirement">{{ diploma.requirement }}</div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <h2 class="display-font">Specialities</h2>
      <p class="text-muted mb-0">Choose a path to explore.</p>
    </div>
    <div class="speciality-grid">
      <div class="speciality-card" *ngFor="let spec of specialities">
        <h3>{{ spec.title }}</h3>
        <p>{{ spec.description }}</p>
        <a class="btn btn-outline-primary" [routerLink]="['/speciality', spec.slug]">View Speciality</a>
      </div>
    </div>
  </div>
</div>
