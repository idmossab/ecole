<div class="container py-5">
  <div class="dashboard-header">
    <div>
      <h1 class="display-font">Admin Dashboard</h1>
      <p class="text-muted">Manage your platform and monitor performance.</p>
    </div>
    <a class="btn btn-dark btn-sm" routerLink="/manage-studies">Manage Studies</a>
  </div>

  <div class="stats-grid">
    <button class="stat-card" type="button" (click)="openStats()">
      <div class="stat-title">Total Students</div>
      <div class="stat-value">{{ stats.totalStudents }}</div>
      <div class="stat-sub">Active students</div>
    </button>
    <button class="stat-card" type="button" (click)="openStats()">
      <div class="stat-title">Total Courses</div>
      <div class="stat-value">{{ stats.totalCourses }}</div>
      <div class="stat-sub">Across certificates</div>
    </button>
    <button class="stat-card" type="button" (click)="openStats()">
      <div class="stat-title">Certificates</div>
      <div class="stat-value">{{ stats.totalCertificates }}</div>
      <div class="stat-sub">Available programs</div>
    </button>
    <button class="stat-card" type="button" (click)="openStats()">
      <div class="stat-title">Diplomas</div>
      <div class="stat-value">{{ stats.totalDiplomas }}</div>
      <div class="stat-sub">Available programs</div>
    </button>
    <button class="stat-card" type="button" (click)="openStats()">
      <div class="stat-title">Diplomas Issued</div>
      <div class="stat-value">0</div>
      <div class="stat-sub">To students</div>
    </button>
    <button class="stat-card" type="button" (click)="openStats()">
      <div class="stat-title">Completion Rate</div>
      <div class="stat-value">0%</div>
      <div class="stat-sub">Average course completion</div>
    </button>
  </div>
</div>
