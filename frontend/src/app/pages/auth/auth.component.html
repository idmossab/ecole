<div class="container py-5">
  <div class="text-center mb-4">
    <h1 class="h3 mb-1">courseonline</h1>
    <p class="text-muted mb-0">Login or create an account to continue.</p>
  </div>

  <div class="row g-4 justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="h5 mb-3">
            <fa-icon class="me-2 text-muted" [icon]="faUser"></fa-icon>
            Login
          </h2>
          <form (ngSubmit)="submitLogin()">
            <div class="mb-3">
              <label class="form-label">Email or Username</label>
              <div class="field-with-icon">
                <span class="field-icon" aria-hidden="true">
                  <fa-icon [icon]="faUser"></fa-icon>
                </span>
                <input
                  type="text"
                  name="emailOrUsername"
                  class="form-control"
                  [(ngModel)]="loginEmailOrUsername"
                  required
                />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <div class="field-with-icon">
                <span class="field-icon" aria-hidden="true">
                  <fa-icon [icon]="faLock"></fa-icon>
                </span>
                <input
                  type="password"
                  name="loginPassword"
                  class="form-control"
                  [(ngModel)]="loginPassword"
                  required
                />
              </div>
            </div>

            <button class="btn btn-dark w-100" type="submit" [disabled]="loginLoading">
              {{ loginLoading ? 'Signing in...' : 'Login' }}
            </button>

            <div class="alert alert-danger mt-3" *ngIf="loginError">{{ loginError }}</div>
          </form>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="h5 mb-3">
            <fa-icon class="me-2 text-muted" [icon]="faUserPlus"></fa-icon>
            Register
          </h2>
          <form (ngSubmit)="submitRegister()">
            <div class="row g-2">
              <div class="col-6">
                <label class="form-label">First name</label>
                <div class="field-with-icon">
                  <span class="field-icon" aria-hidden="true">
                    <fa-icon [icon]="faUser"></fa-icon>
                  </span>
                  <input
                    type="text"
                    class="form-control"
                    name="firstName"
                    [(ngModel)]="firstName"
                    required
                  />
                </div>
              </div>
              <div class="col-6">
                <label class="form-label">Last name</label>
                <div class="field-with-icon">
                  <span class="field-icon" aria-hidden="true">
                    <fa-icon [icon]="faUser"></fa-icon>
                  </span>
                  <input
                    type="text"
                    class="form-control"
                    name="lastName"
                    [(ngModel)]="lastName"
                    required
                  />
                </div>
              </div>
            </div>

            <div class="mb-3 mt-2">
              <label class="form-label">Username</label>
              <div class="field-with-icon">
                <span class="field-icon" aria-hidden="true">
                  <fa-icon [icon]="faUser"></fa-icon>
                </span>
                <input type="text" class="form-control" name="userName" [(ngModel)]="userName" required />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <div class="field-with-icon">
                <span class="field-icon" aria-hidden="true">
                  <fa-icon [icon]="faEnvelope"></fa-icon>
                </span>
                <input type="email" class="form-control" name="email" [(ngModel)]="email" required />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <div class="field-with-icon">
                <span class="field-icon" aria-hidden="true">
                  <fa-icon [icon]="faLock"></fa-icon>
                </span>
                <input type="password" class="form-control" name="password" [(ngModel)]="password" required />
              </div>
            </div>

            <button class="btn btn-outline-dark w-100" type="submit" [disabled]="registerLoading">
              {{ registerLoading ? 'Creating account...' : 'Register' }}
            </button>

            <div class="alert alert-danger mt-3" *ngIf="registerError">{{ registerError }}</div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
