<div class="login-page">
  <div class="login-shell alt-layout">
    <div class="login-illustration alt-illustration">
      <div class="brand-mini">
        <div class="brand-mark">5</div>
        <div class="brand-copy">
          <span class="brand-name">Minute School</span>
          <span class="brand-sub">Study Online, Learn Online</span>
        </div>
      </div>
      <div class="hero-copy">
        <h2>Learn From World's Best Instructors Around The World.</h2>
      </div>
      <div class="floating-icons" aria-hidden="true">
        <span>🚀</span>
        <span>📘</span>
        <span>🧠</span>
        <span>✨</span>
      </div>
      <div class="illustration-card">
        <svg viewBox="0 0 520 420" role="img" aria-label="Student studying">
          <defs>
            <linearGradient id="deskAlt" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#3b2ab2" />
              <stop offset="100%" stop-color="#6d47ff" />
            </linearGradient>
          </defs>
          <rect x="50" y="60" width="420" height="260" rx="22" fill="#7b6dff" opacity="0.22" />
          <circle cx="210" cy="160" r="40" fill="#ffd6a5" />
          <rect x="180" y="200" width="80" height="70" rx="18" fill="#ffd6a5" />
          <rect x="120" y="260" width="280" height="16" rx="8" fill="url(#deskAlt)" />
          <rect x="150" y="276" width="220" height="12" rx="6" fill="#5b44d4" />
          <rect x="120" y="120" width="120" height="70" rx="12" fill="#dbe4ff" />
          <rect x="280" y="120" width="120" height="90" rx="12" fill="#5f4bf2" />
        </svg>
      </div>
    </div>

    <div class="login-panel alt-panel">
      <div class="panel-top">
        <span class="lang">English (USA)</span>
      </div>
      <div class="panel-body">
        <h1>Create Account</h1>
        <p class="panel-sub">Welcome back! Please log in to continue.</p>

        <form class="login-form alt-form" (ngSubmit)="submit()">
          <div class="form-field">
            <label class="form-label">Email or Username</label>
            <div class="field-with-icon">
              <span class="field-icon" aria-hidden="true">
                <fa-icon [icon]="faUser"></fa-icon>
              </span>
              <input
                type="text"
                name="emailOrUsername"
                class="form-control"
                [(ngModel)]="emailOrUsername"
                required
              />
            </div>
          </div>

          <div class="form-field">
            <label class="form-label">Password</label>
            <div class="field-with-icon">
              <span class="field-icon" aria-hidden="true">
                <fa-icon [icon]="faLock"></fa-icon>
              </span>
              <input
                type="password"
                name="password"
                class="form-control"
                [(ngModel)]="password"
                required
              />
            </div>
            <a class="forgot-link" routerLink="/login-required">Forgot Password?</a>
          </div>

          <button class="btn login-btn alt-btn" type="submit" [disabled]="loading">
            {{ loading ? 'Signing in...' : 'Sign In' }}
          </button>

          <div class="alert alert-danger mt-3" *ngIf="error">{{ error }}</div>

          <div class="divider">
            <span>Or Sign In With</span>
          </div>
          <div class="social-row" aria-label="Social login options">
            <button class="social-btn" type="button">G</button>
            <button class="social-btn" type="button">f</button>
            <button class="social-btn" type="button">in</button>
          </div>

          <p class="signup-link">
            New here?
            <a routerLink="/register">Create an account</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
