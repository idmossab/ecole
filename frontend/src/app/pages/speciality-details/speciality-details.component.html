<div class="container py-4">
  <div class="speciality-header">
    <span class="pill">Speciality</span>
    <h1 class="display-font">{{ speciality.title }}</h1>
    <p class="lead">{{ speciality.description }}</p>
  </div>

  <div class="courses-card">
    <div>
      <h2 class="display-font">Courses</h2>
      <p class="text-muted">Courses are not available yet</p>
    </div>
    <div class="cta-group">
      <a class="btn btn-primary" routerLink="/login">Login to access courses</a>
      <a class="btn btn-outline-secondary" routerLink="/login-required">View Course</a>
    </div>
  </div>
</div>
